[build]
  command = "npm run build"
  publish = "dist/client"

[dev]
  port = 8888
  targetPort = 3000

[[edge_functions]]
  path = "/api/news"
  function = "news-proxy"

# AI-friendly Markdown responses for public pages with meaningful written content.
[[edge_functions]]
  path = "/"
  function = "markdown"

[[edge_functions]]
  path = "/about"
  function = "markdown"

[[edge_functions]]
  path = "/contact"
  function = "markdown"

[[edge_functions]]
  path = "/models"
  function = "markdown"

[[edge_functions]]
  path = "/media"
  function = "markdown"

[[edge_functions]]
  path = "/watch"
  function = "markdown"

[[edge_functions]]
  path = "/culture-ledger"
  function = "markdown"

[[edge_functions]]
  path = "/culture-ledger/*"
  function = "markdown"

[[edge_functions]]
  path = "/tribeca/schedule"
  function = "markdown"

[[edge_functions]]
  path = "/tribeca/films/*"
  function = "markdown"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
