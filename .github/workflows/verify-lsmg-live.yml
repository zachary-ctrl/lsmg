name: Verify LSMG live redesign

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-lsmg-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live homepage with cache busting
        run: |
          URL="https://lastshotmediagroup.com/?verify=${GITHUB_SHA}"
          curl -fsSL --retry 3 -H 'Cache-Control: no-cache' "$URL" -o /tmp/live.html
          echo "Fetched live homepage: $(wc -c < /tmp/live.html) bytes"

      - name: Confirm redesigned homepage is live
        run: |
          grep -Fq 'We built LSMG to make the parts of the creative industry' /tmp/live.html
          grep -Fq 'TALENT' /tmp/live.html
          grep -Fq 'MULTIPLE ENGINES' /tmp/live.html
          echo 'VERIFIED: redesigned LSMG homepage is live.'
