name: Deploy LSMG to Netlify

on:
  push:
    branches:
      - agent-the-spelling-of-haile-to-halie-4e2a
    paths:
      - '.github/workflows/deploy-netlify.yml'
      - 'src/**'
      - 'public/**'
      - 'netlify/**'
      - 'netlify.toml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: agent-the-spelling-of-haile-to-halie-4e2a

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Netlify token
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::No NETLIFY_AUTH_TOKEN or NETLIFY_TOKEN repository secret is configured."
            exit 1
          fi

      - name: Build and deploy to Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
        run: |
          npx --yes netlify-cli@latest deploy \
            --build \
            --prod \
            --site 8bf5568f-f9e8-4625-8c4d-050c409c9652 \
            --message "LSMG redesign ${GITHUB_SHA}"
