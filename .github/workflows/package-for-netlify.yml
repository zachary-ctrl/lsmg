# Triggered packaging workflow for the production source tree and Netlify MCP runner
name: Package LSMG source for Netlify

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/package-for-netlify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production branch source
        uses: actions/checkout@v4
        with:
          ref: agent-the-spelling-of-haile-to-halie-4e2a

      - name: Package source tree
        run: |
          tar --exclude=.git --exclude=node_modules -czf /tmp/lsmg-source.tgz .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsmg-source
          path: /tmp/lsmg-source.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Package Netlify MCP runner
        run: |
          mkdir -p /tmp/netlify-mcp-runner
          cd /tmp/netlify-mcp-runner
          npm init -y >/dev/null 2>&1
          npm install @netlify/mcp@latest --no-audit --no-fund
          tar -czf /tmp/netlify-mcp-runner.tgz .

      - name: Upload Netlify MCP runner artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlify-mcp-runner
          path: /tmp/netlify-mcp-runner.tgz
          if-no-files-found: error
          retention-days: 1
